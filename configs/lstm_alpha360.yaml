# ============================================================================
# LSTM（Alpha360 时序特征）—— 深度学习对照组
#
# 与 Qlib 官方 examples/benchmarks/LSTM/workflow_config_lstm_Alpha360.yaml 一致。
#
# 为什么用 Alpha360 而不是 Alpha158？
#   Alpha158 是**截面特征**：每个特征在 t 日只用到 t 日 + 过去 ≤60 天，
#   已经把时序信息「压平」成了标量。LSTM 的价值在于建模序列依赖，
#   直接喂 Alpha158 等于把时序结构丢掉。
#   Alpha360 把过去 60 天的 6 个基础量价字段（open/high/low/close/volume/vwap）
#   排成 (batch, 60, 6) 的序列，正好是 LSTM 的输入格式。
#
# 与 LightGBM 的两个关键差异（README 会展开讨论）：
#   1) 特征：截面特征 vs 时序特征
#   2) 标签处理：LightGBM 直接对原始收益做 MSE 回归；
#               LSTM 用 CSRankNorm 把标签转成**截面排名**（回归 → 排序）
# ============================================================================

qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2008-01-01
    end_time: 2020-08-01
    fit_start_time: 2008-01-01
    fit_end_time: 2014-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
    executor:
        class: SimulatorExecutor
        module_path: qlib.backtest.executor
        kwargs:
            time_per_step: day
            generate_portfolio_metrics: True
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2017-01-01
        end_time: 2020-08-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LSTM
        module_path: qlib.contrib.model.pytorch_lstm
        kwargs:
            d_feat: 6                # Alpha360 的 6 个基础字段
            hidden_size: 64
            num_layers: 2
            dropout: 0.0
            n_epochs: 200
            lr: 1.0e-3
            early_stop: 20
            batch_size: 800
            metric: loss
            loss: mse
            GPU: 0
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha360
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2008-01-01, 2014-12-31]
                valid: [2015-01-01, 2016-12-31]
                test: [2017-01-01, 2020-08-01]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
